name: sweep-orphans

# Manually-triggered sweep of orphan R2 objects listed in
# `scripts/orphan-keys.yaml`. The script defaults to dry-run; flip the
# `apply` input to `true` from the Actions UI to actually delete.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to true to actually delete (default false = dry-run)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Block parallel runs so two operators can't sweep at once.
concurrency:
  group: sweep-orphans
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Sweep orphan R2 objects
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "${APPLY}" = "true" ]; then
            uv run --with boto3 --with pyyaml python scripts/sweep-orphans.py --apply
          else
            uv run --with boto3 --with pyyaml python scripts/sweep-orphans.py
          fi
