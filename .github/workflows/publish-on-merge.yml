name: publish-on-merge

on:
  push:
    branches: [main]
    paths:
      - "submissions/**/*.katib-pack"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect newly added packs
        id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          files=$(git diff --name-only --diff-filter=AM "$base" "$head" -- 'submissions/**/*.katib-pack' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Publish to R2 + registry
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          KATIB_CURATION_TOKEN: ${{ secrets.KATIB_CURATION_TOKEN }}
          REGISTRY_API: ${{ vars.REGISTRY_API }}
        run: |
          if [ -z "${CHANGED_FILES// }" ]; then
            echo "No new packs in this push."
            exit 0
          fi
          uv run --with boto3 --with pyyaml --with requests python scripts/publish-pack.py
